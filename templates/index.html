<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">

<title>Efraín Rojas — Contacto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

      <span class="theme-icon">☾</span>
    </button>
  </div>
</header>

<main class="gate-main">
  <section class="gate-hero">

    <div class="gate-options">
      <a class="gate-card" href="{{ url_for('contact_page') }}">

        <span class="gate-card-desc">Dejame tu nombre, tu correo y tu mensaje. Te respondo directo a tu bandeja de entrada.</span>
      </a>
    </div>

    <p class="gate-admin-link"><a href="{{ url_for('admin_login') }}">Acceso administrador</a></p>
  </section>

<footer>
  <p class="copyright">© 2026 All rights reserved · Designed &amp; built by Efraín Sebastián Rojas Artavia</p>
